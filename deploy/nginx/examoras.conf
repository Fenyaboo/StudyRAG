# Nginx Configuration for Examoras (api.examoras.site & backend.examoras.site)

upstream examoras_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

upstream examoras_dashboard {
    server 127.0.0.1:9000;
    keepalive 16;
}

# ----------------------------------------------------------------------
# 1. Backend API: api.examoras.site (FastAPI Server)
# ----------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.examoras.site;

    client_max_body_size 50m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://examoras_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering no;
    }
}

# ----------------------------------------------------------------------
# 2. Docker Management Dashboard: backend.examoras.site (Portainer CE)
# ----------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name backend.examoras.site;

    client_max_body_size 100m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://examoras_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support for Portainer interactive container console
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 900s;
    }
}
