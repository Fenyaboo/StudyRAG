# Copy to /etc/nginx/sites-available/studyrag.conf and symlink into sites-enabled.
# Run certbot after DNS points api.studyrag.bond to this VPS.
upstream studyrag_api {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.studyrag.bond;

    client_max_body_size 50m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://studyrag_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering no;
    }
}

# After certbot, replace the HTTP server with the generated TLS config or add:
# listen 443 ssl http2;
# ssl_certificate /etc/letsencrypt/live/api.studyrag.bond/fullchain.pem;
# ssl_certificate_key /etc/letsencrypt/live/api.studyrag.bond/privkey.pem;
