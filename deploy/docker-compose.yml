services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: examoras-api:latest
    container_name: examoras-api
    restart: unless-stopped
    env_file:
      - ../backend/.env
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - examoras

  dashboard:
    image: portainer/portainer-ce:latest
    container_name: examoras-docker-dashboard
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      - examoras

networks:
  examoras:
    driver: bridge

volumes:
  portainer_data:
